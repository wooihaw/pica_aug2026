[project]
name = "pica-aug2026"
version = "0.1.0"
description = "Python for Instrument Control and Automation - 2-day training"
readme = "README.md"
authors = [
    { name = "wooihaw", email = "wooihaw.tan@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyserial>=3.5",
    "pysimplegui>=6",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[tool.uv]
# This repository is a set of notebooks and scripts, not an installable package,
# so uv should create the environment without trying to build the project itself.
package = false
